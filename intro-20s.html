<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Intro Sky TG24 26s - brunorachiele.it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  /* CONTENITORE PRINCIPALE (si apre a sipario a fine sigla) */
  #master-stage {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 28% 22%, #103875 0%, #071936 55%, #030a17 100%);
    overflow: hidden;
    will-change: clip-path;
    transition: clip-path 0.75s cubic-bezier(0.77, 0, 0.175, 1);
    clip-path: inset(0 0 0 0);
  }

  #master-stage.studio-launch {
    clip-path: inset(0 0 0 100%);
  }

  /* GRIGLIA PROSPETTICA IN MOVIMENTO */
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 64px 64px;
    transform: perspective(900px) rotateX(25deg) scale(1.25);
    transform-origin: center top;
    animation: gridMove 14s linear infinite;
    z-index: 1;
  }

  @keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 0 220px; }
  }

  /* FASCIO DI LUCE PERIODICO */
  .light-sweep {
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(115deg, transparent 43%, rgba(56, 189, 248, 0.14) 50%, transparent 57%);
    animation: sweep 7s ease-in-out infinite;
    z-index: 2;
  }

  @keyframes sweep {
    0% { transform: translateX(-45%); }
    50%, 100% { transform: translateX(45%); }
  }

  /* 1. LOGO ORIZZONTALE + COUNTDOWN PULITO SENZA BOX */
  #intro-hero {
    position: absolute;
    inset: 0;
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    transition: opacity 0.65s ease, transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
  }

  #intro-hero.hidden-phase {
    opacity: 0;
    transform: scale(0.92);
    pointer-events: none;
  }

  .horizontal-logo {
    width: 780px;
    max-width: 82vw;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.65));
    animation: logoArrive 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes logoArrive {
    0% { opacity: 0; transform: translateY(22px) scale(0.94); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* SOLO TESTO E NUMERI DEL TIMER (NESSUN RIQUADRO) */
  .clean-countdown {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }

  .countdown-kicker {
    font-family: 'Oswald', sans-serif;
    font-size: 24px;
    letter-spacing: 5px;
    color: #7dd3fc;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 12px;
    text-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
  }

  .live-dot {
    width: 11px;
    height: 11px;
    background: #ef4444;
    border-radius: 50%;
    box-shadow: 0 0 12px #ef4444;
    animation: pulse 0.9s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  .countdown-numbers {
    font-family: 'Chakra Petch', sans-serif;
    font-size: 92px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1;
    letter-spacing: 4px;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 10px 35px rgba(0, 0, 0, 0.75), 0 0 28px rgba(56, 189, 248, 0.45);
  }

  /* 2. VETRINA SITO IN PROSPETTIVA 3D (SENZA BARRA DI SCORRIMENTO) */
  #site-stage {
    position: absolute;
    inset: 0;
    z-index: 20;
    perspective: 1700px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.7s ease;
  }

  #site-stage.active {
    opacity: 1;
  }

  .site-card-3d {
    width: 1620px;
    height: 920px;
    border-radius: 20px;
    overflow: hidden;
    background: #ffffff;
    box-shadow: 0 40px 110px rgba(0, 0, 0, 0.8), 0 0 0 3px rgba(255, 255, 255, 0.32);
    transform: rotateY(-7deg) rotateX(3deg) scale(0.96);
    animation: cameraFloat 16s ease-in-out forwards;
    animation-delay: 5.5s;
    position: relative;
  }

  @keyframes cameraFloat {
    0%   { transform: rotateY(-9deg) rotateX(4deg) scale(0.95); }
    50%  { transform: rotateY(-4deg) rotateX(2deg) scale(1.0); }
    100% { transform: rotateY(4deg) rotateX(1deg) scale(1.02); }
  }

  /* Riflesso televisivo diagonale sopra la pagina */
  .site-card-3d::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(125deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 45%);
    pointer-events: none;
    z-index: 10;
  }

  /* Taglio netto della barra di scorrimento laterale (+24px a destra) */
  .iframe-cropper {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
  }

  .site-frame {
    position: absolute;
    top: 0;
    left: 0;
    width: calc(100% + 24px); /* Nasconde completamente la scrollbar laterale */
    height: 2600px;
    border: none;
    will-change: transform, opacity;
    transition: opacity 0.55s ease;
  }

  .scroll-home-anim {
    animation: smoothScrollHome 8.5s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
  }

  .scroll-article-anim {
    animation: smoothScrollArticle 8.5s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
  }

  @keyframes smoothScrollHome {
    0%   { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(0, -760px, 0); }
  }

  @keyframes smoothScrollArticle {
    0%   { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(0, -640px, 0); }
  }

  /* Etichetta discreta in sovrimpressione sulla pagina */
  .page-pill {
    position: absolute;
    bottom: 24px;
    left: 28px;
    z-index: 15;
    background: rgba(7, 25, 54, 0.92);
    color: #ffffff;
    font-family: 'Oswald', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    padding: 8px 22px;
    border-radius: 8px;
    border-left: 5px solid #dc2626;
    text-transform: uppercase;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
  }
</style>
</head>
<body>

  <div id="master-stage">
    <div class="grid-overlay"></div>
    <div class="light-sweep"></div>

    <!-- 1. APERTURA & CHIUSURA: SOLO LOGO ORIZZONTALE + TIMER SENZA BOX -->
    <div id="intro-hero">
      <img class="horizontal-logo" src="https://static.brunorachiele.it/logoorizzontalebianco.png" alt="Bruno Rachiele">
      <div class="clean-countdown" id="countdown-group">
        <div class="countdown-kicker"><span class="live-dot"></span> <span id="kicker-text">LA DIRETTA INIZIA TRA</span></div>
        <div class="countdown-numbers" id="timer-digits">00:25</div>
      </div>
    </div>

    <!-- 2. NAVIGAZIONE SITO IN 3D SENZA SCROLLBAR -->
    <div id="site-stage">
      <div class="site-card-3d">
        <div class="iframe-cropper">
          <iframe id="frame-home" class="site-frame" src="https://brunorachiele.it" scrolling="no"></iframe>
          <iframe id="frame-article" class="site-frame" scrolling="no" style="opacity: 0; pointer-events: none;"></iframe>
        </div>
        <div class="page-pill" id="page-label">BRUNORACHIELE.IT • PRIMA PAGINA</div>
      </div>
    </div>
  </div>

  <!-- Audio precaricato con avvio istantaneo -->
  <audio id="bg-music" src="musica.mp3" autoplay loop preload="auto"></audio>

<script>
  // AVVIO AUDIO IMMEDIATO
  const audioEl = document.getElementById('bg-music');
  audioEl.volume = 0.55;

  function forceAudioStart() {
    if (audioEl.paused) {
      audioEl.play().catch(() => {});
    }
  }
  forceAudioStart();
  audioEl.addEventListener('canplay', forceAudioStart, { once: true });
  document.addEventListener('click', forceAudioStart, { once: true });

  // PRECARICAMENTO ULTIMO ARTICOLO DAL FEED RSS
  const frameHome = document.getElementById('frame-home');
  const frameArticle = document.getElementById('frame-article');
  const pageLabel = document.getElementById('page-label');

  async function preloadLatestArticle() {
    try {
      const res = await fetch('https://brunorachiele.it/feed/');
      const xmlText = await res.text();
      const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
      const firstItem = doc.querySelector('item');
      const linkEl = firstItem ? firstItem.querySelector('link') : null;
      const titleEl = firstItem ? firstItem.querySelector('title') : null;

      if (linkEl && linkEl.textContent) {
        frameArticle.src = linkEl.textContent.trim();
        if (titleEl && titleEl.textContent) {
          frameArticle.dataset.title = titleEl.textContent.trim();
        }
      }
    } catch (e) {
      frameArticle.src = 'https://brunorachiele.it';
    }
  }
  preloadLatestArticle();

  // TIMELINE COMPLETA DA 25 SECONDI
  let secondsLeft = 25;
  const timerDigits = document.getElementById('timer-digits');
  const kickerText = document.getElementById('kicker-text');
  const introHero = document.getElementById('intro-hero');
  const siteStage = document.getElementById('site-stage');

  const ticker = setInterval(() => {
    secondsLeft--;

    if (secondsLeft > 0) {
      timerDigits.textContent = secondsLeft < 10 ? `00:0${secondsLeft}` : `00:${secondsLeft}`;
    } else {
      timerDigits.textContent = 'IN DIRETTA';
      kickerText.textContent = 'BENVENUTI IN STUDIO';
      clearInterval(ticker);
    }

    // A 19s (dopo 6s di logo + timer): nasconde completamente logo e timer e mostra il sito in 3D
    if (secondsLeft === 19) {
      introHero.classList.add('hidden-phase');
      siteStage.classList.add('active');
      frameHome.classList.add('scroll-home-anim');
    }

    // A 11s: apre l'ultimo articolo pubblicato e lo fa scorrere
    if (secondsLeft === 11) {
      pageLabel.textContent = frameArticle.dataset.title
        ? `ULTIMO ARTICOLO • ${frameArticle.dataset.title}`
        : 'ULTIMO ARTICOLO • BRUNORACHIELE.IT';
      frameHome.style.opacity = '0';
      frameArticle.style.opacity = '1';
      frameArticle.classList.add('scroll-article-anim');
    }

    // A 3s: chiude il sito e riporta al centro solo il logo orizzontale bianco per il lancio
    if (secondsLeft === 3) {
      siteStage.classList.remove('active');
      introHero.classList.remove('hidden-phase');
    }

    // A 0s: apre a sipario direttamente sulla tua telecamera in studio
    if (secondsLeft === 0) {
      setTimeout(() => {
        document.getElementById('master-stage').classList.add('studio-launch');
      }, 700);
    }
  }, 1000);
</script>
</body>
</html>
