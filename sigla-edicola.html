<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Sigla Rassegna Stampa - brunorachiele.it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: 'Inter', system-ui, sans-serif;
  }

  /* CONTENITORE PRINCIPALE (si apre a sipario alla fine) */
  #stage {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 70% 30%, #1d4ed8 0%, #091e42 52%, #020617 100%);
    overflow: hidden;
    will-change: clip-path;
    transition: clip-path 0.6s cubic-bezier(0.77, 0, 0.175, 1);
    clip-path: inset(0 0 0 0);
  }

  #stage.curtain-out {
    clip-path: inset(0 0 0 100%);
  }

  /* GRIGLIA LEGGERA DI SFONDO (GPU-friendly) */
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
    background-size: 72px 72px;
    z-index: 1;
  }

  /* FASCE DIAGONALI DINAMICHE STILE BREAKING NEWS */
  .slash-bg {
    position: absolute;
    top: -20%;
    left: -10%;
    width: 55%;
    height: 150%;
    background: linear-gradient(135deg, rgba(220, 38, 38, 0.85) 0%, rgba(185, 28, 28, 0.18) 100%);
    transform: skewX(-18deg) translate3d(-120%, 0, 0);
    will-change: transform;
    animation: slashIn 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    z-index: 2;
  }

  .slash-white {
    position: absolute;
    top: -20%;
    left: 38%;
    width: 14px;
    height: 150%;
    background: rgba(255, 255, 255, 0.88);
    box-shadow: 0 0 28px rgba(255, 255, 255, 0.8);
    transform: skewX(-18deg) translate3d(0, -100%, 0);
    will-change: transform;
    animation: stripeDrop 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.12s forwards;
    z-index: 3;
  }

  @keyframes slashIn {
    to { transform: skewX(-18deg) translate3d(0, 0, 0); }
  }

  @keyframes stripeDrop {
    to { transform: skewX(-18deg) translate3d(0, 0, 0); }
  }

  /* COLONNA SINISTRA: BRAND & TITOLO GIGANTE */
  .left-brand-zone {
    position: absolute;
    left: 95px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 22px;
    max-width: 720px;
  }

  .brand-pill {
    background: #ffffff;
    padding: 18px 34px;
    border-radius: 14px;
    box-shadow: 0 18px 42px rgba(0, 0, 0, 0.48);
    will-change: transform, opacity;
    animation: popLeft 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .brand-pill img {
    height: 76px;
    width: auto;
    display: block;
  }

  @keyframes popLeft {
    0% { opacity: 0; transform: translate3d(-70px, 0, 0) scale(0.92); }
    100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
  }

  .kicker-tag {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: #dc2626;
    color: #ffffff;
    font-family: 'Oswald', sans-serif;
    font-size: 28px;
    letter-spacing: 3px;
    padding: 8px 24px;
    border-radius: 6px;
    text-transform: uppercase;
    box-shadow: 0 10px 26px rgba(220, 38, 38, 0.55);
    opacity: 0;
    will-change: transform, opacity;
    animation: popLeft 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.18s forwards;
  }

  .rec-dot {
    width: 14px;
    height: 14px;
    background: #ffffff;
    border-radius: 50%;
    animation: blink 0.8s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  .main-headline {
    font-family: 'Oswald', sans-serif;
    font-size: 96px;
    line-height: 0.95;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: -1px;
    text-shadow: 0 10px 28px rgba(0, 0, 0, 0.6);
    opacity: 0;
    will-change: transform, opacity;
    animation: popLeft 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.28s forwards;
  }

  .main-headline span {
    color: #38bdf8;
    display: block;
  }

  .date-badge {
    font-size: 22px;
    font-weight: 800;
    color: #e2e8f0;
    background: rgba(15, 23, 42, 0.85);
    border-left: 5px solid #38bdf8;
    padding: 10px 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0;
    will-change: transform, opacity;
    animation: popLeft 0.45s ease 0.4s forwards;
  }

  /* COLONNA DESTRA: PALCOSCENICO 3D CON LE PRIME PAGINE PULITE (SENZA BOX NOME) */
  .right-cover-stage {
    position: absolute;
    right: 115px;
    top: 50%;
    transform: translateY(-50%);
    width: 620px;
    height: 860px;
    perspective: 1400px;
    z-index: 25;
  }

  .hero-paper {
    position: absolute;
    inset: 0;
    background: #ffffff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 28px 70px rgba(0, 0, 0, 0.72), 0 0 0 4px #ffffff;
    opacity: 0;
    transform: translate3d(220px, 0, 0) rotateY(-24deg) scale(0.88);
    will-change: transform, opacity;
    transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
  }

  .hero-paper.active {
    opacity: 1;
    transform: translate3d(0, 0, 0) rotateY(-10deg) scale(1);
    z-index: 5;
  }

  .hero-paper.prev {
    opacity: 0;
    transform: translate3d(-150px, 0, 0) rotateY(15deg) scale(0.9);
    z-index: 2;
  }

  .hero-paper img {
    width: 620px;
    height: 860px;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
</style>
</head>
<body>

  <div id="stage">
    <div class="bg-grid"></div>

    <!-- Tagli diagonali ad alto impatto -->
    <div class="slash-bg"></div>
    <div class="slash-white"></div>

    <!-- Lato sinistro: Logo + Titolo gigante -->
    <div class="left-brand-zone">
      <div class="brand-pill">
        <img src="https://static.brunorachiele.it/logo.png" alt="Bruno Rachiele">
      </div>
      <div class="kicker-tag"><span class="rec-dot"></span> IN DIRETTA • EDICOLA</div>
      <div class="main-headline">LE PRIME <span>PAGINE DI OGGI</span></div>
      <div class="date-badge" id="today-date">RASSEGNA STAMPA QUOTIDIANA</div>
    </div>

    <!-- Lato destro: Copertine grandi pulite senza box nome -->
    <div class="right-cover-stage" id="hero-stage"></div>
  </div>

<script>
  // Data italiana automatica di oggi
  const oggi = new Date().toLocaleDateString('it-IT', {
    weekday: 'long',
    day: 'numeric',
    month: 'long',
    year: 'numeric'
  });
  document.getElementById('today-date').textContent = oggi;

  const testate = [
    'corriere-della-sera',
    'la-repubblica',
    'il-sole-24-ore',
    'la-stampa',
    'il-fatto-quotidiano',
    'il-giornale',
    'libero-quotidiano',
    'la-verita'
  ];

  const baseUrl = 'https://static.brunorachiele.it/copertine/';
  const bust = '?v=' + new Date().toISOString().slice(0, 13);

  const heroStage = document.getElementById('hero-stage');
  const cards = [];

  testate.forEach((slug) => {
    const card = document.createElement('div');
    card.className = 'hero-paper';

    const img = document.createElement('img');
    img.src = baseUrl + slug + '.webp' + bust;
    img.alt = slug;
    img.decoding = 'async';
    img.onerror = function() {
      if (!this.dataset.retried) {
        this.dataset.retried = '1';
        this.src = baseUrl + slug + '.jpg' + bust;
      }
    };

    card.appendChild(img);
    heroStage.appendChild(card);
    cards.push(card);
  });

  // Carrellata fluida delle prime pagine (0.8s ciascuna)
  let current = 0;
  setTimeout(() => {
    cards[0].classList.add('active');
  }, 320);

  const slideTimer = setInterval(() => {
    if (current < cards.length - 1) {
      cards[current].classList.remove('active');
      cards[current].classList.add('prev');
      current++;
      cards[current].classList.add('active');
    } else {
      clearInterval(slideTimer);
    }
  }, 800);

  // A 7.1 secondi apre a sipario direttamente sulla tua telecamera in studio
  setTimeout(() => {
    clearInterval(slideTimer);
    document.getElementById('stage').classList.add('curtain-out');
  }, 7100);
</script>
</body>
</html>
