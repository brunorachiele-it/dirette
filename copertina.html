<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Copertina Live - brunorachiele.it</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: radial-gradient(circle at 28% 22%, #103875 0%, #071936 55%, #030a17 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* GRIGLIA PROSPETTICA IN MOVIMENTO CONTINUO */
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 64px 64px;
    transform: perspective(900px) rotateX(25deg) scale(1.25);
    transform-origin: center top;
    animation: gridMove 8s linear infinite;
  }

  @keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 0 128px; }
  }

  /* FASCIO DI LUCE PERIODICO STILE ALL-NEWS */
  .light-sweep {
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(115deg, transparent 43%, rgba(56, 189, 248, 0.14) 50%, transparent 57%);
    animation: sweep 6s ease-in-out infinite;
  }

  @keyframes sweep {
    0% { transform: translateX(-45%); }
    50%, 100% { transform: translateX(45%); }
  }

  /* ALONE LUMINOSO DIETRO AL LOGO */
  .ambient-glow {
    position: absolute;
    width: 680px;
    height: 360px;
    background: radial-gradient(circle, rgba(14, 165, 233, 0.28) 0%, transparent 70%);
    filter: blur(32px);
    animation: breatheGlow 4s ease-in-out infinite;
    z-index: 2;
  }

  @keyframes breatheGlow {
    0%, 100% { transform: scale(0.95); opacity: 0.7; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  /* SOLO LOGO CENTRALE SENZA BOX */
  .logo-only {
    position: relative;
    z-index: 10;
    max-width: 580px;
    max-height: 220px;
    width: auto;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 24px 50px rgba(0, 0, 0, 0.65));
    animation: logoEnter 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards, logoFloat 5s ease-in-out 0.9s infinite;
  }

  @keyframes logoEnter {
    0% { opacity: 0; transform: scale(0.85); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes logoFloat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }
</style>
</head>
<body>

  <div class="grid-overlay"></div>
  <div class="light-sweep"></div>
  <div class="ambient-glow"></div>

  <!-- SOLO IL LOGO -->
  <img class="logo-only" src="https://static.brunorachiele.it/logo.png" alt="Bruno Rachiele">

  <!-- Audio opzionale se carichi musica.mp3 nel repo dirette -->
  <audio id="bg-music" loop></audio>

<script>
  const params = new URLSearchParams(window.location.search);

  // Se aggiungi ?audio=musica.mp3 all'URL riproduce il file audio in loop
  if (params.get('audio')) {
    const audioEl = document.getElementById('bg-music');
    audioEl.src = params.get('audio');
    audioEl.volume = 0.35;
    audioEl.play().catch(() => {});
  }
</script>
</body>
</html>
