<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Bug Orario Fox Style - brunorachiele.it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
  }

  /* CONTENITORE QUADRATO COMPATTATO IN BASSO A DESTRA (STILE FOX NEWS) */
  .fox-bug {
    position: absolute;
    bottom: 38px;
    right: 44px;
    width: 136px;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55), 0 0 0 1.5px rgba(255, 255, 255, 0.35);
    display: flex;
    flex-direction: column;
    animation: bugEnter 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes bugEnter {
    0% { opacity: 0; transform: translateY(18px) scale(0.94); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* FILETTO ROSSO SUPERIORE TIPICO FOX NEWS */
  .fox-top-stripe {
    height: 5px;
    background: linear-gradient(90deg, #b91c1c 0%, #ef4444 50%, #b91c1c 100%);
  }

  /* QUADRATO PRINCIPALE CON LOGO */
  .fox-square {
    height: 104px;
    background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
    padding: 12px 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Riflesso televisivo leggero stile broadcast */
  .fox-square::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 55%);
    pointer-events: none;
  }

  .fox-square img {
    width: 100%;
    max-height: 76px;
    object-fit: contain;
    display: block;
    position: relative;
    z-index: 1;
  }

  /* FASCIA ORARIO SOTTO IL QUADRATO */
  .fox-time-bar {
    height: 30px;
    background: linear-gradient(180deg, #0b4a9f 0%, #05234d 100%);
    border-top: 2px solid #dc2626;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 8px;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    background: #ef4444;
    border-radius: 50%;
    box-shadow: 0 0 6px #ef4444;
    animation: pulseDot 1.4s infinite;
    flex-shrink: 0;
  }

  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.75); }
  }

  .clock-text {
    font-family: 'Oswald', 'Chakra Petch', sans-serif;
    font-size: 19px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 1.5px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .clock-colon {
    animation: blinkColon 1s steps(1) infinite;
  }

  @keyframes blinkColon {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0.25; }
  }
</style>
</head>
<body>

  <div class="fox-bug">
    <div class="fox-top-stripe"></div>
    <div class="fox-square">
      <img src="https://static.brunorachiele.it/logo.png" alt="Bruno Rachiele">
    </div>
    <div class="fox-time-bar">
      <span class="live-dot"></span>
      <div class="clock-text" id="live-clock">--<span class="clock-colon">:</span>--</div>
    </div>
  </div>

<script>
  function updateClock() {
    const now = new Date();
    const parts = new Intl.DateTimeFormat('it-IT', {
      timeZone: 'Europe/Rome',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    }).formatToParts(now);

    let hh = '00', mm = '00';
    parts.forEach(p => {
      if (p.type === 'hour') hh = p.value;
      if (p.type === 'minute') mm = p.value;
    });

    document.getElementById('live-clock').innerHTML =
      `${hh}<span class="clock-colon">:</span>${mm}`;
  }

  updateClock();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
