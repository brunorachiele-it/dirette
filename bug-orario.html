<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Bug Orario Live - brunorachiele.it</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
  }

  /* CONTENITORE FISSO IN BASSO A DESTRA */
  .news-bug {
    position: absolute;
    bottom: 46px;
    right: 54px;
    width: 230px;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.42), 0 0 0 1px rgba(255, 255, 255, 0.25);
    display: flex;
    flex-direction: column;
    animation: bugEnter 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes bugEnter {
    0% { opacity: 0; transform: translateY(24px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* RIQUADRO LOGO SUPERIORE */
  .bug-logo-box {
    background: rgba(255, 255, 255, 0.98);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bug-logo-box img {
    width: 100%;
    max-height: 54px;
    object-fit: contain;
    display: block;
  }

  /* FASCIA ORARIO STILE ALL-NEWS INFERIORE */
  .bug-time-box {
    background: linear-gradient(135deg, #0b4a9f 0%, #072f66 100%);
    border-top: 3px solid #dc2626;
    padding: 7px 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .live-dot {
    width: 9px;
    height: 9px;
    background: #ef4444;
    border-radius: 50%;
    box-shadow: 0 0 8px #ef4444;
    animation: pulseDot 1.4s infinite;
    flex-shrink: 0;
  }

  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  .clock-text {
    font-family: 'Chakra Petch', 'Inter', sans-serif;
    font-size: 30px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 2px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .clock-colon {
    animation: blinkColon 1s steps(1) infinite;
  }

  @keyframes blinkColon {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0.25; }
  }
</style>
</head>
<body>

  <div class="news-bug">
    <div class="bug-logo-box">
      <img src="https://static.brunorachiele.it/logo.png" alt="Bruno Rachiele">
    </div>
    <div class="bug-time-box">
      <span class="live-dot"></span>
      <div class="clock-text" id="live-clock">--<span class="clock-colon">:</span>--</div>
    </div>
  </div>

<script>
  function updateClock() {
    const now = new Date();
    const parts = new Intl.DateTimeFormat('it-IT', {
      timeZone: 'Europe/Rome',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    }).formatToParts(now);

    let hh = '00', mm = '00';
    parts.forEach(p => {
      if (p.type === 'hour') hh = p.value;
      if (p.type === 'minute') mm = p.value;
    });

    document.getElementById('live-clock').innerHTML =
      `${hh}<span class="clock-colon">:</span>${mm}`;
  }

  updateClock();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
