<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Sigla Live - brunorachiele.it</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  /* SFONDO ANIMATO INIZIALE (si dissolve a fine sigla) */
  #bg-stage {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 20%, #103875 0%, #071936 55%, #030a17 100%);
    z-index: 1;
    transition: opacity 0.9s ease-out;
  }

  /* GRIGLIA EDITORIALE STILE SKY TG24 */
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: perspective(900px) rotateX(25deg) scale(1.2);
    transform-origin: center top;
    animation: gridMove 8s linear infinite;
  }

  @keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 0 120px; }
  }

  /* FASCIO DI LUCE DINAMICO */
  .light-sweep {
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(115deg, transparent 42%, rgba(56, 189, 248, 0.16) 50%, transparent 58%);
    animation: sweep 3.2s ease-in-out forwards;
  }

  @keyframes sweep {
    0% { transform: translateX(-40%); }
    100% { transform: translateX(40%); }
  }

  /* CONTENITORE LOGO CENTRALE */
  #logo-intro {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: all 0.85s cubic-bezier(0.22, 1, 0.36, 1);
  }

  #logo-intro.minimized {
    transform: translate(-740px, -430px) scale(0.36);
    opacity: 0;
  }

  .logo-card {
    background: rgba(255, 255, 255, 0.96);
    padding: 36px 64px;
    border-radius: 24px;
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.55), 0 0 0 2px rgba(255,255,255,0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    animation: logoPop 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes logoPop {
    0% { opacity: 0; transform: scale(0.78) translateY(25px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  .logo-card img {
    height: 110px;
    width: auto;
    object-fit: contain;
  }

  .live-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #dc2626;
    color: #fff;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 2px;
    padding: 8px 22px;
    border-radius: 999px;
    text-transform: uppercase;
    box-shadow: 0 6px 20px rgba(220, 38, 38, 0.45);
  }

  .live-dot {
    width: 12px;
    height: 12px;
    background: #fff;
    border-radius: 50%;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.75); }
  }

  /* FINESTRA SCORRIMENTO SITO IN PROSPETTIVA 3D */
  #site-showcase {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    opacity: 0;
    perspective: 1600px;
    transition: opacity 0.7s ease, transform 0.8s ease;
    pointer-events: none;
  }

  #site-showcase.active {
    opacity: 1;
  }

  #site-showcase.exit {
    opacity: 0;
    transform: scale(1.08);
  }

  .browser-frame {
    width: 1380px;
    height: 820px;
    background: #ffffff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 35px 90px rgba(0, 0, 0, 0.7), 0 0 0 3px rgba(56, 189, 248, 0.45);
    transform: rotateY(-11deg) rotateX(4deg);
    animation: cameraPan 4.2s ease-in-out forwards;
  }

  @keyframes cameraPan {
    0% { transform: rotateY(-14deg) rotateX(6deg) scale(0.92); }
    100% { transform: rotateY(-6deg) rotateX(2deg) scale(1.02); }
  }

  .browser-bar {
    height: 46px;
    background: #0f172a;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 10px;
  }

  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ef4444; }
  .dot.y { background: #f59e0b; }
  .dot.g { background: #22c55e; }

  .url-bar {
    margin-left: 16px;
    background: rgba(255,255,255,0.12);
    color: #f8fafc;
    font-size: 16px;
    font-weight: 600;
    padding: 5px 24px;
    border-radius: 8px;
    letter-spacing: 0.4px;
  }

  .site-viewport {
    width: 100%;
    height: 774px;
    overflow: hidden;
    position: relative;
    background: #f8fafc;
  }

  .site-viewport iframe {
    width: 1380px;
    height: 2400px;
    border: none;
    transform: translateY(0);
    animation: scrollSite 3.8s cubic-bezier(0.35, 0, 0.25, 1) forwards;
    animation-delay: 2.2s;
  }

  @keyframes scrollSite {
    0% { transform: translateY(0); }
    100% { transform: translateY(-780px); }
  }

  /* SOTTOPANCIA INFERIORE TELEVISIVO (RESTA ANCHE DOPO LA SIGLA) */
  #lower-third {
    position: absolute;
    bottom: 48px;
    left: 64px;
    right: 64px;
    display: flex;
    align-items: stretch;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
    z-index: 20;
    transform: translateY(180px);
    opacity: 0;
    transition: all 0.75s cubic-bezier(0.16, 1, 0.3, 1);
  }

  #lower-third.visible {
    transform: translateY(0);
    opacity: 1;
  }

  .lt-brand {
    background: #ffffff;
    padding: 16px 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-right: 4px solid #0b4a9f;
  }

  .lt-brand img {
    height: 44px;
    width: auto;
  }

  .lt-badge {
    background: #dc2626;
    color: #fff;
    font-size: 14px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 6px;
    letter-spacing: 1px;
  }

  .lt-content {
    flex: 1;
    background: linear-gradient(90deg, #0b4a9f 0%, #072f66 100%);
    color: #ffffff;
    padding: 14px 30px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .lt-kicker {
    font-size: 14px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #7dd3fc;
    margin-bottom: 2px;
  }

  .lt-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }
</style>
</head>
<body>

  <!-- SFONDO BLU/SCURO EDITORIALE -->
  <div id="bg-stage">
    <div class="grid-overlay"></div>
    <div class="light-sweep"></div>
  </div>

  <!-- 1. APERTURA LOGO -->
  <div id="logo-intro">
    <div class="logo-card">
      <img src="https://static.brunorachiele.it/logo.png" alt="Bruno Rachiele">
      <div class="live-pill"><span class="live-dot"></span> IN DIRETTA</div>
    </div>
  </div>

  <!-- 2. SCORRIMENTO DEL SITO -->
  <div id="site-showcase">
    <div class="browser-frame">
      <div class="browser-bar">
        <span class="dot r"></span>
        <span class="dot y"></span>
        <span class="dot g"></span>
        <span class="url-bar">https://www.brunorachiele.it</span>
      </div>
      <div class="site-viewport">
        <iframe src="https://www.brunorachiele.it" scrolling="no"></iframe>
      </div>
    </div>
  </div>

  <!-- 3. SOTTOPANCIA FINALE IN STUDIO -->
  <div id="lower-third">
    <div class="lt-brand">
      <img src="https://static.brunorachiele.it/logo.png" alt="Logo">
      <span class="lt-badge">LIVE</span>
    </div>
    <div class="lt-content">
      <div class="lt-kicker" id="lt-kicker">ANALISI, RASSEGNA STAMPA E SONDAGGI</div>
      <div class="lt-title" id="lt-title">Le notizie del giorno su brunorachiele.it</div>
    </div>
  </div>

<script>
  // Legge eventuali parametri URL (?occhiello=...&titolo=...)
  const params = new URLSearchParams(window.location.search);
  if (params.get('occhiello')) document.getElementById('lt-kicker').textContent = params.get('occhiello');
  if (params.get('titolo')) document.getElementById('lt-title').textContent = params.get('titolo');

  // Sequenza temporale stile Sky TG24 (totale ~6.5 secondi)
  setTimeout(() => {
    // 2.1s: sposta il logo e mostra il sito che scorre
    document.getElementById('logo-intro').classList.add('minimized');
    document.getElementById('site-showcase').classList.add('active');
  }, 2100);

  setTimeout(() => {
    // 5.6s: fa entrare il sottopancia in basso
    document.getElementById('lower-third').classList.add('visible');
  }, 5600);

  setTimeout(() => {
    // 6.1s: dissolve lo sfondo e il sito, lasciando la tua camera in studio + sottopancia
    document.getElementById('site-showcase').classList.add('exit');
    document.getElementById('bg-stage').style.opacity = '0';
  }, 6100);
</script>
</body>
</html>
