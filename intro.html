<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Intro Live 10s - brunorachiele.it</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  /* SFONDO EDITORIALE BLU/SCURO (sfuma a fine intro) */
  #bg-stage {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 25% 20%, #103875 0%, #071936 55%, #030a17 100%);
    z-index: 1;
    transition: opacity 0.9s ease-out;
  }

  /* GRIGLIA PROSPETTICA */
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 64px 64px;
    transform: perspective(900px) rotateX(25deg) scale(1.2);
    transform-origin: center top;
    animation: gridMove 10s linear infinite;
  }

  @keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 0 180px; }
  }

  /* FASCIO DI LUCE */
  .light-sweep {
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(115deg, transparent 42%, rgba(56, 189, 248, 0.16) 50%, transparent 58%);
    animation: sweep 4.5s ease-in-out forwards;
  }

  @keyframes sweep {
    0% { transform: translateX(-45%); }
    100% { transform: translateX(45%); }
  }

  /* COUNTDOWN IN DIRETTA (IN ALTO A DESTRA) */
  #countdown-box {
    position: absolute;
    top: 44px;
    right: 56px;
    z-index: 30;
    background: rgba(15, 23, 42, 0.88);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.18);
    border-radius: 18px;
    padding: 16px 28px;
    display: flex;
    align-items: center;
    gap: 18px;
    box-shadow: 0 18px 45px rgba(0, 0, 0, 0.55);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  #countdown-box.exit {
    opacity: 0;
    transform: translateY(-30px);
  }

  .cd-live-indicator {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #dc2626;
    color: #ffffff;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1.5px;
    padding: 8px 16px;
    border-radius: 10px;
    text-transform: uppercase;
  }

  .live-dot {
    width: 11px;
    height: 11px;
    background: #ffffff;
    border-radius: 50%;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.75); }
  }

  .cd-text-wrap {
    display: flex;
    flex-direction: column;
  }

  .cd-label {
    font-size: 13px;
    font-weight: 700;
    color: #94a3b8;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }

  .cd-timer {
    font-size: 38px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
  }

  .cd-timer span {
    font-size: 20px;
    font-weight: 700;
    color: #38bdf8;
    margin-left: 3px;
  }

  /* LOGO DI APERTURA CENTRALE (primi 2.3 secondi) */
  #logo-intro {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 15;
    transition: all 0.85s cubic-bezier(0.22, 1, 0.36, 1);
  }

  #logo-intro.minimized {
    transform: translate(-720px, -410px) scale(0.42);
    opacity: 0;
    pointer-events: none;
  }

  .logo-card {
    background: rgba(255, 255, 255, 0.97);
    padding: 40px 70px;
    border-radius: 26px;
    box-shadow: 0 28px 80px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(255,255,255,0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    animation: logoPop 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes logoPop {
    0% { opacity: 0; transform: scale(0.78) translateY(25px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  .logo-card img {
    height: 120px;
    width: auto;
    object-fit: contain;
  }

  .logo-subtitle {
    font-size: 18px;
    font-weight: 800;
    color: #0b4a9f;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* SCORRIMENTO PROFONDO DEL SITO (da 2.2s a 9.5s) */
  #site-showcase {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    opacity: 0;
    perspective: 1700px;
    transition: opacity 0.8s ease, transform 0.9s ease;
    pointer-events: none;
  }

  #site-showcase.active {
    opacity: 1;
  }

  #site-showcase.exit {
    opacity: 0;
    transform: scale(1.06);
  }

  .browser-frame {
    width: 1460px;
    height: 860px;
    background: #ffffff;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 38px 95px rgba(0, 0, 0, 0.75), 0 0 0 3px rgba(56, 189, 248, 0.45);
    transform: rotateY(-10deg) rotateX(4deg);
    animation: cameraPan 7.8s ease-in-out forwards;
    animation-delay: 2.1s;
  }

  @keyframes cameraPan {
    0% { transform: rotateY(-12deg) rotateX(5deg) scale(0.93); }
    50% { transform: rotateY(-5deg) rotateX(2deg) scale(1.0); }
    100% { transform: rotateY(4deg) rotateX(1deg) scale(1.03); }
  }

  .browser-bar {
    height: 48px;
    background: #0f172a;
    display: flex;
    align-items: center;
    padding: 0 22px;
    gap: 10px;
  }

  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .dot.r { background: #ef4444; }
  .dot.y { background: #f59e0b; }
  .dot.g { background: #22c55e; }

  .url-bar {
    margin-left: 16px;
    background: rgba(255,255,255,0.12);
    color: #f8fafc;
    font-size: 16px;
    font-weight: 600;
    padding: 5px 24px;
    border-radius: 8px;
    letter-spacing: 0.4px;
  }

  .site-viewport {
    width: 100%;
    height: 812px;
    overflow: hidden;
    position: relative;
    background: #f8fafc;
  }

  /* Iframe molto alto per permettere uno scorrimento profondo lungo tutta la home */
  .site-viewport iframe {
    width: 1460px;
    height: 3800px;
    border: none;
    transform: translateY(0);
    animation: scrollSiteDeep 7.4s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    animation-delay: 2.3s;
  }

  @keyframes scrollSiteDeep {
    0% { transform: translateY(0); }
    100% { transform: translateY(-2200px); }
  }
</style>
</head>
<body>

  <!-- SFONDO -->
  <div id="bg-stage">
    <div class="grid-overlay"></div>
    <div class="light-sweep"></div>
  </div>

  <!-- COUNTDOWN 10 SECONDI -->
  <div id="countdown-box">
    <div class="cd-live-indicator"><span class="live-dot"></span> LIVE</div>
    <div class="cd-text-wrap">
      <div class="cd-label" id="cd-label">IN DIRETTA TRA</div>
      <div class="cd-timer" id="cd-timer">10<span>sec</span></div>
    </div>
  </div>

  <!-- 1. LOGO CENTRALE -->
  <div id="logo-intro">
    <div class="logo-card">
      <img src="https://static.brunorachiele.it/logo.png" alt="Bruno Rachiele">
      <div class="logo-subtitle">Analisi • Rassegna Stampa • Sondaggi</div>
    </div>
  </div>

  <!-- 2. SCORRIMENTO SITO -->
  <div id="site-showcase">
    <div class="browser-frame">
      <div class="browser-bar">
        <span class="dot r"></span>
        <span class="dot y"></span>
        <span class="dot g"></span>
        <span class="url-bar">https://www.brunorachiele.it</span>
      </div>
      <div class="site-viewport">
        <iframe src="https://www.brunorachiele.it" scrolling="no"></iframe>
      </div>
    </div>
  </div>

<script>
  // Countdown reale da 10 a 0
  let secondsLeft = 10;
  const timerEl = document.getElementById('cd-timer');
  const labelEl = document.getElementById('cd-label');

  const countdownInterval = setInterval(() => {
    secondsLeft--;
    if (secondsLeft > 0) {
      timerEl.innerHTML = secondsLeft + '<span>sec</span>';
    } else {
      clearInterval(countdownInterval);
      labelEl.textContent = 'COLLEGAMENTO';
      timerEl.innerHTML = 'IN ONDA';
    }
  }, 1000);

  // 2.2s: sposta il logo e fa partire lo scorrimento profondo del sito
  setTimeout(() => {
    document.getElementById('logo-intro').classList.add('minimized');
    document.getElementById('site-showcase').classList.add('active');
  }, 2200);

  // 9.8s: dissolve tutto (sfondo, sito e countdown) lasciando pulita la telecamera in studio
  setTimeout(() => {
    document.getElementById('site-showcase').classList.add('exit');
    document.getElementById('countdown-box').classList.add('exit');
    document.getElementById('bg-stage').style.opacity = '0';
  }, 9800);
</script>
</body>
</html>
